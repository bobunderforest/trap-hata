<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Trap Hata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <canvas></canvas>
    <button
      class="info-button"
      type="button"
      aria-label="About this game"
      aria-haspopup="dialog"
    >
      <svg
        class="info-button__icon"
        viewBox="0 0 3 8"
        width="6"
        height="16"
        aria-hidden="true"
        shape-rendering="crispEdges"
      >
        <rect x="1" y="0" width="1" height="1" />
        <rect x="0" y="2" width="2" height="1" />
        <rect x="1" y="3" width="1" height="4" />
        <rect x="0" y="7" width="3" height="1" />
      </svg>
    </button>
    <dialog class="about" aria-labelledby="about-title" closedby="any">
      <h2 class="about__title" id="about-title">Trap Hata</h2>
      <p>
        This small game was made for a hackathon back in 2016 by two friends,
        <a href="https://github.com/jeetiss" target="_blank" rel="noopener"
          >Dmitrii Ivakhnenko</a
        >
        and
        <a href="https://bobunderforest.me/" target="_blank" rel="noopener"
          >Dmitrii Podlesnyi</a
        >.
      </p>
      <p>
        You can check its source code on the
        <a
          href="https://github.com/bobunderforest/trap-hata"
          target="_blank"
          rel="noopener"
          >Github repository</a
        >.
      </p>
      <form method="dialog">
        <button class="about__close" type="submit">Close</button>
      </form>
    </dialog>
    <aside class="lobby">
      <a class="lobby__link" target="_blank" rel="noopener"
        ><div class="lobby__qr"></div
      ></a>
      <p class="lobby__status">Connecting…</p>
      <p class="lobby__count"></p>
    </aside>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
